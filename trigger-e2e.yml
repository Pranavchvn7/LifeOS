# Put this file in the APP repository (the LifeOS website), not in lifeos-e2e.
# After Vercel finishes a deployment, it tells the e2e repo to run the smoke tests against it.
name: Trigger E2E tests after deploy

on:
  deployment_status: # Vercel reports every deployment to GitHub; this fires for each one

permissions:
  contents: read

jobs:
  trigger:
    # Only when the deployment succeeded (not when it is merely "pending" or "failed")
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check the setup
        env:
          TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN }}
          E2E_REPO: ${{ vars.E2E_REPO }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::Secret E2E_DISPATCH_TOKEN is missing (see docs/CI-CD-SETUP.md, part 2)"; exit 1; }
          [ -n "$E2E_REPO" ] || { echo "::error::Repository variable E2E_REPO is missing, e.g. your-username/lifeos-e2e"; exit 1; }

      - name: Send the deployment to the e2e repo
        env:
          TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN }}
          E2E_REPO: ${{ vars.E2E_REPO }}
          PROD_URL: ${{ vars.E2E_PROD_URL }}
          ON_PREVIEW: ${{ vars.E2E_ON_PREVIEW }}
          ENVIRONMENT: ${{ github.event.deployment_status.environment }}
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          SHA: ${{ github.event.deployment.sha }}
          REF: ${{ github.event.deployment.ref }}
          APP_REPO: ${{ github.repository }}
        run: |
          case "$ENVIRONMENT" in
            Production*)
              # Test the stable public address, not the one-off deployment address (which Vercel may protect).
              URL="${PROD_URL:-$DEPLOY_URL}" ;;
            *)
              if [ "$ON_PREVIEW" != "true" ]; then
                echo "Preview deployment skipped. Set repository variable E2E_ON_PREVIEW=true to test previews too."
                exit 0
              fi
              URL="$DEPLOY_URL" ;;
          esac
          [ -n "$URL" ] || { echo "::error::No deployment URL to test"; exit 1; }

          export URL
          body=$(python3 - <<'PY'
          import json, os
          sha = os.environ.get("SHA", "")
          print(json.dumps({
              "event_type": "app-deployed",
              "client_payload": {
                  "url": os.environ["URL"],
                  "environment": os.environ.get("ENVIRONMENT", ""),
                  "sha": sha,
                  "short_sha": sha[:7],
                  "ref": os.environ.get("REF", ""),
                  "repo": os.environ.get("APP_REPO", ""),
              },
          }))
          PY
          )

          code=$(curl -s -o response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$E2E_REPO/dispatches" -d "$body")

          if [ "$code" != "204" ]; then
            echo "::error::GitHub answered HTTP $code: $(cat response.txt)"
            exit 1
          fi
          msg="GitHub accepted the message (HTTP 204). Sent the $ENVIRONMENT deployment ($URL, ${SHA:0:7}) to $E2E_REPO."
          echo "$msg"
          echo "Now open https://github.com/$E2E_REPO/actions - a run called 'E2E (repository_dispatch ...)' should appear within a few seconds."
          echo "If nothing appears: e2e.yml on the MAIN branch of $E2E_REPO must contain 'repository_dispatch' (see docs/CI-CD-SETUP.md)."
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
